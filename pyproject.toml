[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-extras"
version = "0.1.0"
description = "A drop-in claude that routes each project to its own account, with usage, resume, search and chat across all of them"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/maximdeclercq/claude-extras"
Documentation = "https://maximdeclercq.github.io/claude-extras/"

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=7"]
docs = ["mkdocs-material>=9"]

[project.scripts]
claude = "claude_extras.cli:main"

[tool.setuptools.packages.find]
include = ["claude_extras*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
